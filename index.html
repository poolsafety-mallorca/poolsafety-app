<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#B91C1C" />
  <title>PoolSafety · Acceso</title>
  <link rel="icon" type="image/png" href="assets/logo-blanco.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/logo-blanco.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PoolSafety" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/ps-aviso-error.js"></script>
  <script src="js/theme-toggle.js"></script>
</head>
<body>

<div class="splash">

  <svg class="splash-wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
    <path d="M0,80 C240,40 480,110 720,80 C960,50 1200,110 1440,80 L1440,120 L0,120 Z" fill="#22D3EE" fill-opacity=".08"/>
    <path d="M0,90 C240,60 480,120 720,90 C960,60 1200,120 1440,90 L1440,120 L0,120 Z" fill="#0EA5E9" fill-opacity=".12"/>
  </svg>

  <div class="splash-card login-card">
    <div class="splash-logo-wrap">
      <img src="assets/logo-blanco.png" alt="PoolSafety" />
    </div>

    <h1 class="splash-title" style="font-size: 28px;">Acceso a la app</h1>
    <p class="splash-sub">Inicia sesión con tu correo y contraseña. Tu rol se detecta automáticamente.</p>

    <form id="loginForm" class="login-form" autocomplete="on">
      <div class="field">
        <label for="loginEmail">Correo electrónico</label>
        <input type="email" id="loginEmail" placeholder="tu@correo.com" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" placeholder="Contraseña" required autocomplete="current-password" />
      </div>
      <div id="loginError" class="login-error" style="display:none;"></div>
      <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">
        <svg class="ic ic-18"><use href="#ic-arrow-right"/></svg>
        <span id="loginBtnText">Entrar</span>
      </button>
    </form>

    <div class="login-help">
      <a href="#" onclick="abrirResetModal(); return false;">¿Olvidaste la contraseña?</a>
    </div>
  </div>

  <!-- Modal recuperar contraseña -->
  <div class="modal-backdrop" id="resetModal">
    <div class="modal" style="max-width: 420px;">
      <div class="modal-head">
        <div>
          <h3>Recuperar contraseña</h3>
          <p class="small text-muted mt-1" style="margin:4px 0 0;">Te enviaremos un email con un enlace para poner una contraseña nueva.</p>
        </div>
        <button class="modal-close" onclick="cerrarResetModal()">
          <svg class="ic ic-16"><use href="#ic-x"/></svg>
        </button>
      </div>
      <div class="field">
        <label>Tu correo electrónico</label>
        <input type="email" id="resetEmail" placeholder="tu@correo.com" autocomplete="email" />
      </div>
      <div id="resetMsg" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="cerrarResetModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="enviarResetEmail()" id="resetSendBtn">
          <svg class="ic ic-16"><use href="#ic-arrow-up-right"/></svg>
          Enviar enlace
        </button>
      </div>
    </div>
  </div>

  <div class="splash-footer">
    <span>PoolSafety Des Llevant, S.L. · Producción</span>
    <span id="connStatus" style="opacity:.7; font-size:10px;"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/pwa-install.js"></script>
<script src="js/icons.js"></script>
<script>
(async function () {
  // Si ya hay sesión activa, redirige directamente
  const { data: { session } } = await window.sb.auth.getSession();
  if (session) {
    await redirectByRole(session.user);
  }

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('loginBtnText');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    btn.disabled = true;
    btnText.textContent = 'Entrando…';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;

    try {
      const { data, error } = await window.sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await redirectByRole(data.user);
    } catch (err) {
      errBox.textContent = err.message === 'Invalid login credentials'
        ? 'Email o contraseña incorrectos.'
        : 'Error al conectar: ' + err.message;
      errBox.style.display = 'block';
      btn.disabled = false;
      btnText.textContent = 'Entrar';
    }
  });

  async function redirectByRole(user) {
    try {
      const { data: usuario, error } = await window.sb
        .from('usuarios')
        .select('rol, empresa_id, activo, nombre')
        .eq('id', user.id)
        .single();

      if (error || !usuario) {
        errBox.textContent = 'Usuario válido pero sin perfil asignado. Contacta con el administrador.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Entrar';
        await window.sb.auth.signOut();
        return;
      }
      if (!usuario.activo) {
        errBox.textContent = 'Tu cuenta está desactivada. Contacta con el coordinador.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Entrar';
        await window.sb.auth.signOut();
        return;
      }

      // Guardar sesión ligera para acceso rápido en el resto de páginas
      localStorage.setItem('ps-session', JSON.stringify({
        userId: user.id,
        email: user.email,
        rol: usuario.rol,
        nombre: usuario.nombre,
        empresa_id: usuario.empresa_id
      }));

      if (usuario.rol === 'socorrista') {
        window.location.href = 'socorrista.html';
      } else {
        // dueño y coordinador -> mismo dashboard
        window.location.href = 'coordinador.html';
      }
    } catch (err) {
      errBox.textContent = 'Error obteniendo perfil: ' + err.message;
      errBox.style.display = 'block';
      btn.disabled = false;
      btnText.textContent = 'Entrar';
    }
  }

  window.abrirResetModal = function () {
    const emailLogin = document.getElementById('loginEmail').value.trim();
    if (emailLogin) document.getElementById('resetEmail').value = emailLogin;
    document.getElementById('resetMsg').style.display = 'none';
    document.getElementById('resetSendBtn').disabled = false;
    document.getElementById('resetModal').classList.add('open');
  };
  window.cerrarResetModal = function () {
    document.getElementById('resetModal').classList.remove('open');
  };
  window.enviarResetEmail = async function () {
    const email = document.getElementById('resetEmail').value.trim();
    const msg = document.getElementById('resetMsg');
    const btn = document.getElementById('resetSendBtn');
    if (!email || !/\S+@\S+\.\S+/.test(email)) {
      msg.className = 'login-error';
      msg.textContent = 'Escribe un email válido.';
      msg.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<svg class="ic ic-16"><use href="#ic-signal"/></svg> Enviando…';
    try {
      const { error } = await window.sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset.html'
      });
      if (error) throw error;
      msg.className = 'alert-strip ok';
      msg.style.display = 'flex';
      msg.innerHTML = `<svg class="ic ic-16"><use href="#ic-check-circle"/></svg><div><b>Email enviado a ${email}</b><br><span class="small">Revisa la bandeja de entrada (y spam por si acaso). El enlace caduca en 1 hora.</span></div>`;
    } catch (err) {
      msg.className = 'login-error';
      msg.style.display = 'block';
      msg.textContent = 'Error: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg class="ic ic-16"><use href="#ic-arrow-up-right"/></svg> Enviar enlace';
    }
  };

  // Estado de conexión discreto en el footer
  setTimeout(() => {
    const el = document.getElementById('connStatus');
    if (el) el.textContent = '· BD conectada';
  }, 1200);
})();
</script>
</body>
</html>
